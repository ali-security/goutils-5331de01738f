name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Pack module zip
        run: |
          set -euo pipefail
          # Module tree without VCS metadata and without this (Seal-authored) workflow dir,
          # which upstream never shipped.
          mkdir -p "$RUNNER_TEMP/module"
          tar --exclude=./.git --exclude=./.github -cf - . | tar -C "$RUNNER_TEMP/module" -xf -
          mkdir -p "$RUNNER_TEMP/packer" dist
          cat > "$RUNNER_TEMP/packer/main.go" <<'EOF'
          package main

          import (
            "log"
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
          )

          func main() {
            m := module.Version{Path: os.Args[1], Version: os.Args[2]}
            f, err := os.Create(os.Args[4])
            if err != nil {
              log.Fatal(err)
            }
            defer f.Close()
            if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
              log.Fatal(err)
            }
            log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          cd "$RUNNER_TEMP/packer"
          go mod init example.com/packer
          go get golang.org/x/mod@v0.17.0
          go run . github.com/Masterminds/goutils v1.1.0 "$RUNNER_TEMP/module" "$GITHUB_WORKSPACE/dist/v1.1.0.zip"
          unzip -l "$GITHUB_WORKSPACE/dist/v1.1.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/v1.1.0.zip
          if-no-files-found: error
